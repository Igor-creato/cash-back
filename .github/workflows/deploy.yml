name: Deploy to server

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy via SSH
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            PLUGIN_DIR=/home/igor/cash-back/deploy-cashback/service/volumes/wordpress/wp-content/plugins/cash-back
            cd "$PLUGIN_DIR"
            git -c safe.directory="$PLUGIN_DIR" remote -v
            git -c safe.directory="$PLUGIN_DIR" branch
            git -c safe.directory="$PLUGIN_DIR" log --oneline -3
            git -c safe.directory="$PLUGIN_DIR" pull --ff-only origin main
            git -c safe.directory="$PLUGIN_DIR" log --oneline -3
