name: Deploy to server

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
      - feature/product-price-monitor-service

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy via SSH
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        contains(fromJSON('["main","feature/product-price-monitor-service"]'), github.event.workflow_run.head_branch)
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            DEPLOY_BRANCH='${{ github.event.workflow_run.head_branch }}'
            case "$DEPLOY_BRANCH" in
              main|feature/product-price-monitor-service) ;;
              *) echo "Unsupported deploy branch: $DEPLOY_BRANCH"; exit 1 ;;
            esac

            PLUGIN_DIR=/home/igor/cash-back/deploy-cashback/service/volumes/wordpress/wp-content/plugins/cash-back
            cd "$PLUGIN_DIR"
            git -c safe.directory="$PLUGIN_DIR" remote -v
            git -c safe.directory="$PLUGIN_DIR" fetch --prune origin "$DEPLOY_BRANCH"
            if git -c safe.directory="$PLUGIN_DIR" show-ref --verify --quiet "refs/heads/$DEPLOY_BRANCH"; then
              git -c safe.directory="$PLUGIN_DIR" checkout "$DEPLOY_BRANCH"
            else
              git -c safe.directory="$PLUGIN_DIR" checkout -b "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
            fi
            git -c safe.directory="$PLUGIN_DIR" branch
            git -c safe.directory="$PLUGIN_DIR" log --oneline -3
            git -c safe.directory="$PLUGIN_DIR" pull --ff-only origin "$DEPLOY_BRANCH"
            git -c safe.directory="$PLUGIN_DIR" log --oneline -3

            # opcache invalidation (production has opcache.validate_timestamps=Off
            # for performance — без этого шага новый код не подхватится pool-воркерами).
            # SIGUSR2 на php-fpm master = graceful reload: новые воркеры с свежим
            # opcache, активные запросы не обрываются.
            echo ">> Reloading PHP-FPM (graceful, USR2)..."
            docker kill -s USR2 wordpress
            sleep 2

            # WP object cache (Redis) — сбрасываем чтобы изменённые шорткоды/options
            # обновились моментально, а не по TTL.
            echo ">> Flushing WP object cache..."
            docker exec wordpress wp --allow-root cache flush || true
